global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'go-backend'
    static_configs:
      - targets: ['172.18.0.1:8080']
    metrics_path: '/metrics'

  - job_name: 'python-ml'
    static_configs:
      - targets: ['172.18.0.1:8001']
    metrics_path: '/metrics'
